<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Pipsqueak Miku Live2D Viewer</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
	<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		font-family: Inter, sans-serif;
	}
	
	html,
	body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: radial-gradient(circle at top, #4e7cff 0%, #2b326b 35%, #161623 100%);
	}
	
	canvas {
		display: block;
	}
	
	#viewer {
		position: absolute;
		left: 0;
		top: 0;
		width: 100%;
		height: 100%;
		cursor: grab;
	}
	
	#viewer:active {
		cursor: grabbing;
	}
	
	.panel {
		position: fixed;
		left: 25px;
		top: 25px;
		width: 300px;
		background: rgba(255, 255, 255, .08);
		backdrop-filter: blur(20px);
		border-radius: 20px;
		padding: 18px;
		color: white;
		box-shadow: 0 8px 40px rgba(0, 0, 0, .25);
		user-select: none;
	}
	
	.title {
		font-size: 22px;
		font-weight: 700;
		margin-bottom: 10px;
	}
	
	.subtitle {
		opacity: .75;
		font-size: 13px;
		margin-bottom: 18px;
		line-height: 20px;
	}
	
	button {
		width: 100%;
		padding: 13px;
		margin-top: 8px;
		border: none;
		border-radius: 12px;
		background: #ffffff18;
		color: white;
		font-size: 15px;
		cursor: pointer;
		transition: .25s;
	}
	
	button:hover {
		background: #ffffff35;
		transform: translateY(-2px);
	}
	
	button:active {
		transform: scale(.98);
	}
	
	.group {
		margin-top: 20px;
	}
	
	.group h3 {
		font-size: 13px;
		opacity: .7;
		margin-bottom: 8px;
	}
	
	#status {
		margin-top: 18px;
		font-size: 13px;
		opacity: .75;
		line-height: 20px;
	}
	
	#fps {
		position: fixed;
		right: 25px;
		top: 25px;
		background: #00000055;
		color: #00ff95;
		padding: 10px 15px;
		border-radius: 14px;
		font-weight: bold;
		font-size: 14px;
		backdrop-filter: blur(15px);
	}
	
	.footer {
		position: fixed;
		bottom: 25px;
		left: 50%;
		transform: translateX(-50%);
		background: #ffffff12;
		padding: 12px 18px;
		border-radius: 20px;
		backdrop-filter: blur(15px);
		color: white;
		font-size: 13px;
	}
	
	kbd {
		background: #00000033;
		padding: 3px 8px;
		border-radius: 6px;
		margin: 0 2px;
	}
	
	button {
		background: rgba(255, 255, 255, .09)
	}
	
	button:hover {
		background: rgba(255, 255, 255, .2)
	}
	
	#fps {
		background: rgba(0, 0, 0, .35)
	}
	
	.footer {
		background: rgba(255, 255, 255, .08)
	}
	
	kbd {
		background: rgba(0, 0, 0, .25)
	}
	</style>
</head>

<body>
	<canvas id="viewer"></canvas>
	<div class="panel">
		<div class="title"> 🎀 Pipsqueak Miku </div>
		<div class="subtitle"> Live2D Cubism Viewer
			<br> Optimized Demo using Pixi + live2d-widget </div>
		<div class="group">
			<h3>Expressions</h3>
			<button id="randomExpression"> 😊 Random Expression </button>
			<button id="resetExpression"> 🔄 Reset Expression </button>
		</div>
		<div class="group">
			<h3>Motions</h3>
			<button id="randomMotion"> 🎬 Random Motion </button>
			<button id="idleMotion"> 💤 Idle Motion </button>
		</div>
		<div class="group">
			<h3>Viewer</h3>
			<button id="resetCamera"> 📍 Reset Camera </button>
			<button id="fullscreen"> 🖥 Fullscreen </button>
		</div>
		<div id="status"> Loading model... </div>
	</div>
	<div id="fps"> FPS --- </div>
	<div class="footer"> Drag — Move | Mouse Wheel — Zoom | <kbd>Space</kbd> Random Motion | <kbd>R</kbd> Reset </div>
	<!-- test -->
	<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/ludl3/live2dcubismcore@master/live2dcubismcore.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
	<script defer src="js/app.js?v=3"></script>
