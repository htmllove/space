<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#39c5bb">
  <meta name="color-scheme" content="dark">

  <title>Мой Pet Спэйс — галерея pet-проектов</title>
  <meta name="description" content="Галерея моих pet-проектов, сайтов и экспериментальных штук.">
  <meta name="keywords" content="pet projects, веб-разработка, эксперименты, GitHub Pages">
  <meta name="author" content="htmllove">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://space.solodev.ru/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Мой Pet Спэйс">
  <meta property="og:description" content="Галерея моих pet-проектов, сайтов и экспериментальных штук.">

  <meta property="og:site_name" content="Мой Pet Спэйс">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Мой Pet Спэйс">
  <meta name="twitter:description" content="Галерея моих pet-проектов, сайтов и экспериментальных штук.">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Мой Pet Спэйс",
    "description": "Галерея моих pet-проектов, сайтов и экспериментальных штук.",
    "url": "https://space.solodev.ru/",
    "inLanguage": "ru"
  }
  </script>

  <style>
    :root {
      --color-bg: #071719;
      --color-bg-soft: #0b2224;
      --color-surface: rgba(14, 47, 49, 0.72);
      --color-surface-solid: #0e2f31;
      --color-text: #ecfffd;
      --color-muted: #9bc7c4;
      --color-primary: #39c5bb;
      --color-primary-light: #79fff2;
      --color-secondary: #137a7f;
      --color-accent: #ff4f9a;
      --color-border: rgba(121, 255, 242, 0.2);
      --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.28);
      --container: 1680px;
      --panel-height: 58px;
      --radius: 22px;
      --transition: 260ms cubic-bezier(.2, .8, .2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      background: var(--color-bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--color-text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(57, 197, 187, 0.18), transparent 32rem),
        radial-gradient(circle at 88% 16%, rgba(255, 79, 154, 0.1), transparent 28rem),
        linear-gradient(145deg, #061214 0%, #092326 52%, #071719 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(121, 255, 242, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(121, 255, 242, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100% - 32px, var(--container));
      margin-inline: auto;
      padding: clamp(64px, 9vw, 130px) 0 56px;
    }

    .hero {
      max-width: 900px;
      margin-bottom: clamp(42px, 6vw, 84px);
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--color-primary-light);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before {
      width: 26px;
      height: 2px;
      content: "";
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
    }

    .hero__title {
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 7.8rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    .hero__title-accent {
      color: transparent;
      background: linear-gradient(100deg, var(--color-primary-light), var(--color-primary) 55%, #34a4b6);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .hero__description {
      max-width: 820px;
      margin: 28px 0 0;
      color: var(--color-muted);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      line-height: 1.75;
    }

    .gallery__heading {
      margin: 0 0 22px;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: -0.035em;
    }

    .gallery__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .project-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      opacity: 0;
      background: var(--color-surface);
      box-shadow: var(--shadow-card);
      transform: translateY(24px) scale(0.98);
      transition:
        transform var(--transition),
        opacity 500ms ease,
        border-color var(--transition),
        box-shadow var(--transition);
      backdrop-filter: blur(14px);
    }

    .project-card--visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .project-card:hover {
      border-color: rgba(121, 255, 242, 0.52);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.38), 0 0 28px rgba(57, 197, 187, 0.09);
      transform: translateY(-5px);
    }

    .project-card__link {
      display: flex;
      height: 100%;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
    }

    .project-card__media {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, #123b3e, #081c1e);
    }

    .project-card__image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 600ms cubic-bezier(.2, .8, .2, 1), filter var(--transition);
    }

    .project-card:hover .project-card__image {
      filter: saturate(1.08);
      transform: scale(1.045);
    }

    .project-card__category {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      background: rgba(5, 23, 25, 0.72);
      backdrop-filter: blur(10px);
    }

    .project-card__body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 20px;
    }

    .project-card__title {
      margin: 0;
      font-size: clamp(1.08rem, 1.6vw, 1.35rem);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .project-card__description {
      display: -webkit-box;
      margin: 11px 0 18px;
      overflow: hidden;
      color: var(--color-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .project-card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: auto 0 0;
      padding: 0;
      list-style: none;
    }

    .project-card__tag {
      padding: 5px 8px;
      border: 1px solid rgba(57, 197, 187, 0.25);
      border-radius: 7px;
      color: var(--color-primary-light);
      font-size: 0.7rem;
      background: rgba(57, 197, 187, 0.07);
    }

    .preloader {
      display: grid;
      min-height: 230px;
      place-items: center;
      transition: opacity 220ms ease;
    }

    .preloader--hidden {
      display: none;
    }

    .preloader__inner {
      display: grid;
      justify-items: center;
      gap: 14px;
      color: var(--color-muted);
      font-size: 0.82rem;
    }

    .preloader__spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(57, 197, 187, 0.16);
      border-top-color: var(--color-primary-light);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
      box-shadow: 0 0 22px rgba(57, 197, 187, 0.18);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 34px;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius);
      color: var(--color-muted);
      text-align: center;
    }

    .nav-panel {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      display: none;
      min-height: var(--panel-height);
      padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(121, 255, 242, 0.3);
      opacity: 1;
      background: linear-gradient(100deg, rgba(8, 36, 39, 0.96), rgba(19, 122, 127, 0.92), rgba(57, 197, 187, 0.9));
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
      transition: opacity var(--transition);
      backdrop-filter: blur(16px) saturate(1.2);
    }

    .nav-panel--visible {
      display: flex;
    }

    .nav-panel__list {
      display: flex;
      max-width: 100%;
      margin: 0;
      padding: 0;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      list-style: none;
    }

    .nav-panel__list::-webkit-scrollbar {
      display: none;
    }

    .nav-panel__link {
      display: inline-flex;
      min-height: 36px;
      padding: 7px 12px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(236, 255, 253, 0.55);
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      background: rgba(5, 27, 29, 0.22);
      transition: color var(--transition), background var(--transition), border-color var(--transition), transform var(--transition);
    }

    .nav-panel__link:hover {
      border-color: #fff;
      color: #062427;
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-1px);
    }

    .project-view {
      display: none;
      height: 100vh;
      padding-top: var(--panel-height);
      background: #fff;
    }

    .project-view--visible {
      display: block;
    }

    .project-view__frame {
      display: block;
      width: 100%;
      height: calc(100vh - var(--panel-height));
      border: 0;
      background: #fff;
    }

    .project-view__loader {
      position: fixed;
      inset: var(--panel-height) 0 0;
      z-index: 5;
      display: grid;
      place-items: center;
      color: var(--color-muted);
      background: var(--color-bg);
    }

    .project-view__loader--hidden {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (orientation: landscape) and (max-width: 767px) {
      .gallery__grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .page {
        width: min(100% - 56px, var(--container));
      }

      .gallery__grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      .project-card__body {
        padding: 22px;
      }

      .nav-panel__link {
        padding-inline: 16px;
        font-size: 0.8rem;
      }
    }

    @media (min-width: 768px) and (max-width: 1180px) and (orientation: landscape) {
      .gallery__grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .project-card__body {
        padding: 16px;
      }
    }

    @media (min-width: 1181px) {
      .gallery__grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 24px;
      }
    }

    @media (min-width: 1800px) {
      .gallery__grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .nav-panel {
        opacity: 0.72;
      }

      .nav-panel:hover,
      .nav-panel:focus-within {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <nav class="nav-panel" id="navPanel" aria-label="Навигация по проектам">
    <ul class="nav-panel__list">
      <li><button class="nav-panel__link" id="allProjects" type="button">Все проекты</button></li>
      <li><button class="nav-panel__link" id="previousProject" type="button">Предыдущий</button></li>
      <li><button class="nav-panel__link" id="nextProject" type="button">Следующий</button></li>
      <li><button class="nav-panel__link" id="randomProject" type="button">Случайный</button></li>
    </ul>
  </nav>

  <main class="page" id="galleryPage">
    <header class="hero">
      <p class="hero__eyebrow">личные web эксперименты</p>
      <h1 class="hero__title">Мой <span class="hero__title-accent">Pet Спэйс</span></h1>
      <p class="hero__description">
        Здесь обитают и занимают место на странице некоторые мои питомцы, сайты и просто какие-то странные экспериментальные штуки. Если чего-то нет, то maybe появится... когда нибудь.
      </p>
    </header>

    <section class="gallery" aria-labelledby="galleryTitle">
      <h2 class="gallery__heading" id="galleryTitle">Проекты</h2>

      <div class="preloader" id="preloader" role="status" aria-live="polite">
        <div class="preloader__inner">
          <span class="preloader__spinner" aria-hidden="true"></span>
          <span>Ищу питомцев…</span>
        </div>
      </div>

      <div class="gallery__grid" id="projectGrid"></div>
    </section>
  </main>

  <section class="project-view" id="projectView" aria-label="Открытый проект">
    <div class="project-view__loader" id="projectLoader" role="status">
      <div class="preloader__inner">
        <span class="preloader__spinner" aria-hidden="true"></span>
        <span>Открываю проект…</span>
      </div>
    </div>
    <iframe
      class="project-view__frame"
      id="projectFrame"
      title="Открытый pet-проект"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads"
    ></iframe>
  </section>

  <noscript>
    <p style="padding: 2rem; color: #ecfffd; font-family: sans-serif;">
      Для загрузки галереи необходимо включить JavaScript.
    </p>
  </noscript>

  <script type="module" async defer>
    // Здесь указываются только имена директорий проектов.
    const PROJECTS = [
      "live2dmiku",
      "mclaude",
      "mikugram"
    ];

    const SITE_ROOT = new URL("/", window.location.origin);
    const galleryPage = document.querySelector("#galleryPage");
    const projectGrid = document.querySelector("#projectGrid");
    const preloader = document.querySelector("#preloader");
    const navPanel = document.querySelector("#navPanel");
    const projectView = document.querySelector("#projectView");
    const projectFrame = document.querySelector("#projectFrame");
    const projectLoader = document.querySelector("#projectLoader");

    let currentProjectIndex = -1;

    const projectUrl = (slug) => new URL(`${encodeURIComponent(slug)}/`, SITE_ROOT);

    function normalizeTags(tags) {
      if (Array.isArray(tags)) return tags.map(String).filter(Boolean);
      if (typeof tags === "string") return tags.split(",").map((tag) => tag.trim()).filter(Boolean);
      return [];
    }

    function loadImage(slug) {
      const sources = ["cover.webp", "cover.jpg"];

      return new Promise((resolve) => {
        const trySource = (index) => {
          if (index >= sources.length) {
            resolve("");
            return;
          }

          const image = new Image();
          const src = new URL(`${encodeURIComponent(slug)}/${sources[index]}`, SITE_ROOT).href;
          image.onload = () => resolve(src);
          image.onerror = () => trySource(index + 1);
          image.src = src;
        };

        trySource(0);
      });
    }

    async function loadProject(slug, index) {
      const descriptionUrl = new URL(`${encodeURIComponent(slug)}/desc.json`, SITE_ROOT);
      const [response, cover] = await Promise.all([fetch(descriptionUrl), loadImage(slug)]);

      if (!response.ok) {
        throw new Error(`Не удалось загрузить ${descriptionUrl.pathname}`);
      }

      const data = await response.json();

      return {
        slug,
        index,
        title: String(data.title || data.name || slug),
        description: String(data.description || "Описание скоро появится."),
        category: String(data.category || "Pet project"),
        tags: normalizeTags(data.tags),
        cover
      };
    }

    function createCard(project) {
      const article = document.createElement("article");
      const link = document.createElement("a");
      const media = document.createElement("div");
      const body = document.createElement("div");
      const title = document.createElement("h3");
      const description = document.createElement("p");
      const category = document.createElement("span");
      const tags = document.createElement("ul");

      article.className = "project-card";
      article.style.transitionDelay = `${Math.min(project.index * 55, 440)}ms`;

      link.className = "project-card__link";
      link.href = projectUrl(project.slug).pathname;
      link.dataset.project = project.slug;
      link.setAttribute("aria-label", `Открыть проект «${project.title}»`);

      media.className = "project-card__media";
      category.className = "project-card__category";
      category.textContent = project.category;
      media.append(category);

      if (project.cover) {
        const image = document.createElement("img");
        image.className = "project-card__image";
        image.src = project.cover;
        image.alt = `Обложка проекта «${project.title}»`;
        image.loading = project.index < 4 ? "eager" : "lazy";
        image.decoding = "async";
        media.prepend(image);
      }

      body.className = "project-card__body";
      title.className = "project-card__title";
      title.textContent = project.title;
      description.className = "project-card__description";
      description.textContent = project.description;
      tags.className = "project-card__tags";
      tags.setAttribute("aria-label", "Теги проекта");

      project.tags.forEach((tag) => {
        const item = document.createElement("li");
        item.className = "project-card__tag";
        item.textContent = tag;
        tags.append(item);
      });

      body.append(title, description, tags);
      link.append(media, body);
      article.append(link);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => article.classList.add("project-card--visible"));
      });

      return article;
    }

    async function initGallery() {
      if (!PROJECTS.length) {
        preloader.classList.add("preloader--hidden");
        projectGrid.innerHTML = '<p class="empty-state">Нет проектов?! Всысле, а чем ты занимался?</p>';
        return;
      }

      const results = await Promise.allSettled(
        PROJECTS.map((slug, index) => loadProject(slug, index))
      );

      const fragment = document.createDocumentFragment();

      results.forEach((result) => {
        if (result.status === "fulfilled") {
          fragment.append(createCard(result.value));
        } else {
          console.warn(result.reason);
        }
      });

      preloader.classList.add("preloader--hidden");
      projectGrid.append(fragment);

      if (!projectGrid.children.length) {
        projectGrid.innerHTML = '<p class="empty-state">Проекты пока не загрузились. T_T</p>';
      }
    }

    function injectBase(html, baseUrl) {
      const base = `<base href="${baseUrl.href}">`;

      if (/<head[\s>]/i.test(html)) {
        return html.replace(/<head([^>]*)>/i, `<head$1>${base}`);
      }

      return `<!doctype html><html><head>${base}</head><body>${html}</body></html>`;
    }

    async function openProject(slug, pushState = true) {
      const index = PROJECTS.indexOf(slug);
      if (index === -1) return;

      currentProjectIndex = index;
      galleryPage.hidden = true;
      navPanel.classList.add("nav-panel--visible");
      projectView.classList.add("project-view--visible");
      projectLoader.classList.remove("project-view__loader--hidden");
      document.body.style.overflow = "hidden";

      const url = projectUrl(slug);
      if (pushState) history.pushState({ project: slug }, "", url.pathname);

      try {
        const response = await fetch(url, {
          headers: { "X-PJAX": "true" }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const html = await response.text();
        projectFrame.title = `Проект: ${slug}`;
        projectFrame.srcdoc = injectBase(html, url);
        document.title = `${slug} — Мой Pet Спэйс`;
      } catch (error) {
        console.warn("PJAX недоступен, выполняется обычный переход.", error);
        window.location.assign(url.href);
      }
    }

    function showGallery(pushState = true) {
      currentProjectIndex = -1;
      projectFrame.srcdoc = "";
      projectView.classList.remove("project-view--visible");
      navPanel.classList.remove("nav-panel--visible");
      galleryPage.hidden = false;
      document.body.style.overflow = "";
      document.title = "Мой Pet Спэйс — галерея pet-проектов";

      if (pushState) history.pushState({}, "", SITE_ROOT.pathname);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openRelativeProject(offset) {
      if (!PROJECTS.length) return;
      const nextIndex = (currentProjectIndex + offset + PROJECTS.length) % PROJECTS.length;
      openProject(PROJECTS[nextIndex]);
    }

    function openRandomProject() {
      if (!PROJECTS.length) return;

      let index = Math.floor(Math.random() * PROJECTS.length);
      if (PROJECTS.length > 1 && index === currentProjectIndex) {
        index = (index + 1) % PROJECTS.length;
      }

      openProject(PROJECTS[index]);
    }

    projectGrid.addEventListener("click", (event) => {
      const link = event.target.closest("[data-project]");
      if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;

      event.preventDefault();
      openProject(link.dataset.project);
    });

    projectFrame.addEventListener("load", () => {
      projectLoader.classList.add("project-view__loader--hidden");
    });

    document.querySelector("#allProjects").addEventListener("click", () => showGallery());
    document.querySelector("#previousProject").addEventListener("click", () => openRelativeProject(-1));
    document.querySelector("#nextProject").addEventListener("click", () => openRelativeProject(1));
    document.querySelector("#randomProject").addEventListener("click", openRandomProject);

    window.addEventListener("popstate", () => {
      const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean)[0] || "");

      if (PROJECTS.includes(slug)) {
        openProject(slug, false);
      } else {
        showGallery(false);
      }
    });

    initGallery();
  </script>
</body>
</html>
