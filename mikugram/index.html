<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Переход на сайт</title>

  <style>
    :root {
      --bg: #05090c;
      --surface: rgba(10, 21, 25, 0.82);
      --text: #effffd;
      --muted: #a8c8c5;
      --miku: #39c5bb;
      --miku-light: #74fff2;
      --miku-dark: #168f89;
      --border: rgba(93, 242, 231, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(57, 197, 187, 0.13), transparent 30%),
        radial-gradient(circle at 80% 85%, rgba(57, 197, 187, 0.09), transparent 32%),
        linear-gradient(145deg, #030608, var(--bg) 55%, #071114);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(57, 197, 187, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 100px rgba(57, 197, 187, 0.08),
        inset 0 0 100px rgba(57, 197, 187, 0.04);
      pointer-events: none;
    }

    main {
      position: relative;
      isolation: isolate;
      width: min(100%, 680px);
      padding: clamp(36px, 7vw, 64px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow:
        0 0 0 1px rgba(57, 197, 187, 0.04),
        0 0 35px rgba(57, 197, 187, 0.12),
        0 28px 90px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(116, 255, 242, 0.18),
        transparent 35%,
        transparent 65%,
        rgba(57, 197, 187, 0.1)
      );
      opacity: 0.65;
      pointer-events: none;
    }

    .mark {
      width: 62px;
      height: 4px;
      margin: 0 auto 30px;
      background: var(--miku-light);
      border-radius: 999px;
      box-shadow:
        0 0 8px var(--miku),
        0 0 20px rgba(57, 197, 187, 0.8),
        0 0 42px rgba(57, 197, 187, 0.45);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.2rem, 7vw, 3.75rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
      text-wrap: balance;
      text-shadow:
        0 0 18px rgba(116, 255, 242, 0.2),
        0 0 42px rgba(57, 197, 187, 0.1);
    }

    p {
      max-width: 560px;
      margin: 0 auto 36px;
      color: var(--muted);
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      line-height: 1.7;
      text-wrap: balance;
    }

    .button {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 26px;
      color: #021211;
      background: linear-gradient(135deg, var(--miku-light), var(--miku));
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 10px;
      box-shadow:
        0 0 16px rgba(57, 197, 187, 0.32),
        0 0 36px rgba(57, 197, 187, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      font-weight: 750;
      text-decoration: none;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .button::after {
      content: "↗";
      font-size: 1.1em;
      transition: transform 180ms ease;
    }

    .button:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow:
        0 0 22px rgba(57, 197, 187, 0.55),
        0 0 52px rgba(57, 197, 187, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .button:hover::after {
      transform: translate(2px, -2px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:focus-visible {
      outline: 3px solid rgba(116, 255, 242, 0.55);
      outline-offset: 5px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .button::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>

    <h1>Переход на сайт</h1>

    <p>
      Этот сайт нельзя открыть в Pet Space по техническим причинам.
      Перейдите на оригинальный домен проекта.
    </p>

    <a
      class="button"
      href="https://mikugram.solodev.ru"
      target="_blank"
      rel="noopener noreferrer"
    >
      Перейти на сайт проекта
    </a>
  </main>
</body>
</html>
